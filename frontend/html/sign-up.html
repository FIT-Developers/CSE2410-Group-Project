<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<!-- Enable Standalone Fullscreen Mode for iOS Safari -->
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Campus Map">

	<title>Sign Up - Campus Navigator</title>

	<!-- Our CSS -->
	<link rel="stylesheet" href="../css/global.css" />
	<link rel="stylesheet" href="../css/signup.css" />

	<!-- Scripts -->
	<script src="../js/navbar.js" defer></script>
	<script src="../js/signup.js" defer></script>

	<!-- Theme -->
	<script src="../js/theme.js"></script>
	
</head>

<body>
	<div id="sign-up">

		<!-- Nav Bar -->
		<div id="navbar-placeholder"></div>

		<!-- Sign Up Page -->
		<div id="signup-page">

			<!-- Header -->
			<header id="signup-page-header">
				<h1 id="header-title">Create an Account</h1>
				<p id="header-subtitle">
					Save your favorite campus buildings, customize filters, and sync your walking schedule.
				</p>
			</header>

			<!-- Sign Up Form Content -->
			<main id="signup-page-content">
				<div id="signup-form-div">
					<form id="signup-form" action="/api/signup" method="post">
						<p id="signup-error" role="alert"></p>

						<div class="form-group">
							<label for="username">Username</label>
							<input type="text" placeholder="Create your username..." id="username" name="username" autocomplete="username" required>
						</div>

						<div class="form-group">
							<label for="password">Password</label>
							<input type="password" placeholder="Create your password..." id="password" name="password" autocomplete="new-password" required>
						</div>

						<input type="submit" value="Create Account">

						<p class="auth-switch">
							Already have an account? <a href="./login.html">Log in</a>
						</p>
					</form>
				</div>
			</main>

		</div>
	</div>
</body>

</html>
