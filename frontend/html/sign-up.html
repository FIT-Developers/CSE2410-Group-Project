<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/signup.js" defer></script>
	<!-- Enable Standalone Fullscreen Mode for iOS Safari (Obtained from online sources/documentation)-->
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Campus Map">

	<title>Sign Up</title>
	
	<!-- Our CSS -->
	<link rel="stylesheet" href="css/global.css" />
	<link rel="stylesheet" href="css/signup.css" />
	
	
</head>

<body>
	<div id="sign-up">

		<!-- Nav Bar -->
		<nav id="nav-bar">
			<ul id="nav-ul">
				<li><a href="./home.html">Home</a></li>

				<li><a href="./about.html">About</a></li>

				<li><a href="./map.html">Map</a></li>


			</ul>

			<ul id="nav-login-signup">
				<li><a href="./login.html">Login</a></li>

				<div id="nav-login-signup-vertical-bar"></div>

				<li><a href="./sign-up.html">Sign Up</a></li>
			</ul>
		</nav>

		<!-- Signup page -->
		<div id="signup-page">
			<!-- Header -->
			<header id="signup-page-header">
				<h1 id="header-title">Sign up</h1>
			</header>


			<!-- Login Page Content -->
			 <div id="signup-page-content">
                <div id="signup-form-div">
				<form id="signup-form" action="/api/signup" method="post">
                        <p id="signup-error" role="alert"></p>

						<label for="username">Username:</label>
                        <input type="text" placeholder="Create your Username..." id="username" name="username" autocomplete="username" required><br><br>
                        <label for="password">Password:</label>
                        <input type="password" placeholder="Create your Password..." id="password" name="password" autocomplete="new-password" required><br><br>

                        <input type="submit" value="Submit">
                  </form>
            </div> 
        </div> 
    </div> 
</div> 
</body>
</html>
