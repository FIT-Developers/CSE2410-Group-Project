			 <div id="login-page-content">

						<input type="email" placeholder="Enter your student email..." id="fname" name="fname"><br><br>
						<label for="lname">Password:</label>
						<input type="password" placeholder="Enter your password..." id="lname" name="lname"><br><br>
						<input type="submit" value="Submit">
					</form>
				</div>

			 </div>
