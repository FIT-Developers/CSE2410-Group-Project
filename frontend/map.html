<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FIT Campus Map</title>
	
	<!-- Apple Mobile Meta Tags -->
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	
	<!-- Google Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

	<!-- Leaflet CSS -->
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	
	<!-- Custom CSS -->
	<link rel="stylesheet" href="css/global.css">
	<link rel="stylesheet" href="css/map.css">

	<!-- Boundary Canvas Script -->
	<script src="https://cdn.jsdelivr.net/npm/leaflet-boundary-canvas@1.0.0/src/leaflet-boundary-canvas.min.js"></script>
</head>
<body>

	<!-- 1. Shared Navigation Header -->
	<header class="navbar">
		<div class="nav-logo">
			<a href="home.html">Campus Map</a>
		</div>
		<nav class="nav-links">
			<a href="home.html">Home</a>
			<a href="map.html" class="active">Map</a>
			<a href="scheduling.html">Scheduling</a>
			<a href="about.html">About</a>
			<a href="login.html" class="btn-login">Login</a>
		</nav>
	</header>

	<!-- 2. Floating Map Overlay Controls -->
	<div class="map-controls">
		<!-- Search Input & Results Dropdown -->
		<div class="search-container">
			<input 
				type="text" 
				id="search-input" 
				placeholder="Search campus buildings, dorms, dining..." 
				autocomplete="off"
			/>
			<ul id="search-results" class="search-results hidden"></ul>
		</div>

		<!-- Category Filter Pills -->
		<div class="category-filters">
			<button class="filter-btn active" data-category="all">All</button>
			<button class="filter-btn" data-category="Facility">Facilities</button>
			<button class="filter-btn" data-category="Dorm">Dorms</button>
			<button class="filter-btn" data-category="Sport">Sports</button>
			<button class="filter-btn" data-category="Parking">Parking</button>
		</div>
	</div>

	<!-- Leaflet Map Container -->
	<div id="map"></div>

	<!-- Slide-out Drawer Panel -->
	<div class="marker-popup" id="marker-popup">
		<!-- Popup contents remain unchanged -->
	</div>

	<!-- Scripts -->
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script type="module" src="js/map.js"></script>
</body>
</html>
