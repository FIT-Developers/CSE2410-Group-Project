<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content">

	<!-- Enable Standalone Fullscreen Mode for iOS Safari (Obtained from online sources/documentation)-->
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Campus Map">

	<!-- Google font stuff -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100;200;300;400;500;600;700&display=swap"
		rel="stylesheet">


	<title>Campus Map</title>
	<link rel="icon" type="svg" href="./assets/icons/menu-icons/tab-icon.svg" />
	<!-- Our CSS -->
	<link rel="stylesheet" href="css/global.css" />
	<link rel="stylesheet" href="css/scheduling.css" />


</head>

<body id="body">
	<div class="bottom-nav" id="footer">
		<a href="map.html" class="nav-item">
			<img src="./assets/icons/menu-icons/compass.svg" alt="" class="icon">
		</a>
		<a href="scheduling.html" class="nav-item active">
			<img src="./assets/icons/menu-icons/calendar.svg" alt="" class="icon">
		</a>
		<a href="home.html" class="nav-item">
			<img src="./assets/icons/menu-icons/user.svg" alt="" class="icon">
		</a>
		<a href="home.html" class="nav-item">
			<img src="./assets/icons/menu-icons/setting.svg" alt="" class="icon">
		</a>
	</div>





	<div class="schedule-area" id="scheduleArea">
		<div class="schedule-grid">
	
			<div class="corner-cell"></div>
	
			<!-- Sticky Day Headers -->
			<div class="head" id="mon-head">
				<span class="name">Mon</span>
			</div>
			<div class="head" id="tues-head">
				<span class="name">Tues</span>
			</div>
			<div class="head" id="wed-head">
				<span class="name">Wed</span>
			</div>
			<div class="head" id="thurs-head">
				<span class="name">Thurs</span>
			</div>
			<div class="head" id="fri-head">
				<span class="name">Fri</span>
			</div>
	
			<div class="time-col">
				<div class="time">8am</div>
				<div class="time">9am</div>
				<div class="time">10am</div>
				<div class="time">11am</div>
				<div class="time">12pm</div>
				<div class="time">1pm</div>
				<div class="time">2pm</div>
				<div class="time">3pm</div>
				<div class="time">4pm</div>
				<div class="time">5pm</div>
				<div class="time">6pm</div>
				<div class="time">7pm</div>
				<div class="time">8pm</div>
				<div class="time">9pm</div>
			</div>
	
			<!-- Empty grid lines -->
			<div class="day-col" id="mon-col"></div>
			<div class="day-col" id="tues-col"></div>
			<div class="day-col" id="wed-col"></div>
			<div class="day-col" id="thurs-col"></div>
			<div class="day-col" id="fri-col"></div>
	
		</div>
	</div>

	<div class="add-btn" id="add-btn">
		<img src="./assets/icons/menu-icons/plus.svg" alt="" class="icon">
	</div>



	<div class="marker-popup" id="marker-popup">
		<div class="drag-handle">
			<img src="./assets/icons/menu-icons/handle.svg" alt="" class="icon">
		</div>

		<div id="container">
			<h1 class="label">Class Name</h1>
		</div>
		<div id="icontainer">
			<input type="text" style="width:100%" class="input" id="clsname" placeholder="" />
		</div>

		<div class="grid" style="grid-template-columns: 100px 1fr 1fr;">
			<h1 class="label">Day</h1>
			<h1 class="label">Start Time</h1>
			<h1 class="label">End Time</h1>
		
			<select class="input" id="day-select">
				<option value="Mon">Mon</option>
				<option value="Tues">Tues</option>
				<option value="Wed">Wed</option>
				<option value="Thurs">Thurs</option>
				<option value="Fri">Fri</option>
			</select>
			<input type="text" class="input" id="starttime" placeholder="" />
			<input type="text" class="input" id="endtime" placeholder="" />
		</div>

		<div id="container">
			<h1 class="label">Location</h1>
		</div>
		<div id="icontainer">
			<select id="location-select" style="width:100%" class="input">
				<option value="" disabled selected></option>
			</select>
		</div>

		<div class="grid" style="grid-template-columns: 1fr 90px;">
			<h1 class="label">Room Number</h1>
			<h1 class="label">Color</h1>

			<input type="text" class="input" id="rmnum" placeholder="" />
			<input type="color" class="input" id="color"/>
		</div>
		<div id="container" style="margin-top: 1rem;">
			<div id="cls-btn">
				<h1>Add Class</h1>
			</div>
		</div>
	</div>

	<!-- Our JavaScript -->
	<script src="js/schedule/fetches.js"></script>
	<script src="js/schedule/buttons.js"></script>
	<script src="js/schedule/classes.js"></script>

</body>

</html>
